name: Deploy Portfolio to AWS S3 & CloudFront

on:
  push:
    branches:
      - main
      - refactor/nova-arquitetura
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Unit Tests
        run: npm run test -- --run

      - name: Build Production Bundle (Vite)
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # 1. Arquivos Estáticos Compilados (CSS, JS, Imagens em dist/assets) - Cache Longo (1 ano)
      - name: Deploy Static Assets (dist/ - cache longo)
        run: |
          aws s3 sync dist/ s3://${{ secrets.AWS_S3_BUCKET_NAME }} \
            --delete \
            --exclude "index.html" \
            --exclude "robots.txt" \
            --exclude "sitemap.xml" \
            --cache-control "max-age=31536000, immutable"

      # 2. HTML e Arquivos de Descoberta (index.html, robots.txt, sitemap.xml) - Sem Cache
      - name: Deploy Entry Files (dist/ -sem cache)
        run: |
          aws s3 sync dist/ s3://${{ secrets.AWS_S3_BUCKET_NAME }} \
            --exclude "*" \
            --include "index.html" \
            --include "robots.txt" \
            --include "sitemap.xml" \
            --cache-control "max-age=0, no-cache, no-store, must-revalidate"

      # 3. Invalidação do CloudFront para propagação imediata no domínio      
      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"