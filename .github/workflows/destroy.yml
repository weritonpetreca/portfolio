name: Destroy Portfolio Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment stack to destroy (staging or prod)"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  destroy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Delete SAM Backend Stack (${{ inputs.environment }})
        run: |
          STACK_NAME="portfolio-backend-contact-${{ inputs.environment }}"
          echo "Iniciando a destruição da stack $STACK_NAME..."
          aws cloudformation delete-stack \
            --stack-name "$STACK_NAME" \
            --region us-east-1

          aws cloudformation wait stack-delete-complete \
            --stack-name "$STACK_NAME" \
            --region us-east-1
          echo "Stack $STACK_NAME destruída com sucesso!"
